[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "necos-rs-gradient-analysis"
version = "0.1.0"
description = "NECOS resting-state gradient and post-hoc connectivity workflows."
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [
	{ name = "Agata Patyczek" },
	{ name = "Elias Reinwarth" },
	{ name = "Samyogita Hardikar" }
]
dependencies = [
	"numpy>=1.24",
	"pandas>=2.0",
	"scipy>=1.10",
	"nibabel>=5.0",
	"nilearn>=0.10",
	"brainspace>=0.1.10",
	"matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
	"ipykernel>=6.29"
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
